<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบร้านค้าสหกรณ์โรงเรียนบ้านโสน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="loading" class="loading">
    <div class="loading__inner">
      <i class="fa-solid fa-store loading__icon"></i>
      <p>กำลังโหลดระบบ...</p>
    </div>
  </div>

  <section id="loginPage" class="login-page hidden">
    <div class="login-card">
      <div class="login-card__header">
        <div class="brand-mark brand-mark--large">
          <i class="fa-solid fa-store"></i>
        </div>
        <h1>ระบบร้านค้าสหกรณ์โรงเรียนบ้านโสน</h1>
        <p>เข้าสู่ระบบเพื่อใช้งาน</p>
      </div>

      <form id="loginForm" class="login-form">
        <label for="loginUsername">ชื่อผู้ใช้งาน</label>
        <input id="loginUsername" name="username" autocomplete="username" value="admin">

        <label for="loginPassword">รหัสผ่าน</label>
        <input id="loginPassword" name="password" type="password" autocomplete="current-password" value="123456">

        <button id="loginBtn" type="submit" class="btn btn--primary btn--full">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>เข้าสู่ระบบ</span>
        </button>
      </form>

      <p id="loginMessage" class="login-message" aria-live="polite"></p>
      <p class="credit">Design by Tanawarat khamsiang</p>
    </div>
  </section>

  <div id="app" class="app hidden">
    <div id="sidebarBackdrop" class="sidebar-backdrop hidden"></div>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar__brand">
        <button id="closeSidebarBtn" class="icon-btn icon-btn--mobile" type="button" aria-label="ปิดเมนู">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="brand-mark">
          <i class="fa-solid fa-store"></i>
        </div>
        <div class="brand-text">
          <h2>ระบบร้านค้าสหกรณ์โรงเรียนบ้านโสน</h2>
          <p>ระบบจัดการร้านค้า V 1.0</p>
        </div>
      </div>

      <div class="today-card">
        <p class="today-card__label">สถิติวันนี้</p>
        <div class="today-card__grid">
          <div>
            <p>ยอดขาย</p>
            <strong id="sideSales">฿0</strong>
          </div>
          <div class="text-right">
            <p>รายการ</p>
            <strong id="sideCount">0</strong>
          </div>
        </div>
      </div>

      <nav id="menu" class="menu" aria-label="เมนูหลัก"></nav>
    </aside>

    <main class="content">
      <header class="header">
        <div class="header__left">
          <button id="openSidebarBtn" class="icon-btn icon-btn--mobile" type="button" aria-label="เปิดเมนู">
            <i class="fa-solid fa-bars"></i>
          </button>
          <span id="breadcrumb" class="breadcrumb">
            <i class="fa-solid fa-house"></i>
            หน้าหลัก
          </span>
        </div>

        <div class="header__right">
          <div class="user-summary">
            <p id="topName">ผู้ดูแลระบบ</p>
            <span id="topRole">admin</span>
          </div>
          <button id="logoutBtn" class="btn btn--danger" type="button">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>ออกจากระบบ</span>
          </button>
        </div>
      </header>

      <section id="page" class="page"></section>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
