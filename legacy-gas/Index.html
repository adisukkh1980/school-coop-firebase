<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <style>
    *{font-family:'Kanit',sans-serif} body{background:#f3f4f6}.sidebar{transition:.25s;height:100vh;overflow:hidden;display:flex;flex-direction:column}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}.menu-active{background:#eaf2ff;color:#1d4ed8}.hidden{display:none!important}.product-overview-img{width:60px!important;height:60px!important;min-width:60px!important;min-height:60px!important;max-width:60px!important;max-height:60px!important;object-fit:cover!important;display:block!important;flex:0 0 28px!important;position:static!important;inset:auto!important;transform:none!important}#menu{flex:1;overflow-y:auto;min-height:0;padding-bottom:18px}#menu::-webkit-scrollbar{width:6px}#menu::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:999px}#menu::-webkit-scrollbar-track{background:transparent}@media(max-width:768px){.sidebar{position:fixed;z-index:50;left:-260px}.sidebar.open{left:0}.content{margin-left:0!important}}
    @media print{.no-print{display:none!important}.print-only{display:block!important}body{background:#fff}.card{box-shadow:none;border:none}}

<body>
<div id="loading" class="fixed inset-0 bg-white z-[100] flex items-center justify-center"><div class="text-center"><i class="fa-solid fa-store text-5xl text-blue-600 mb-3"></i><p>กำลังโหลดระบบ...</p></div></div>

<div id="loginPage" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-700 to-slate-900 hidden">
  <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-20 h-20 rounded-2xl bg-blue-100 text-blue-600 flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-store text-4xl"></i></div>
      <h1 class="text-2xl font-bold">ระบบร้านค้าสหกรณ์โรงเรียนบ้านโสน</h1>
      <p class="text-gray-500">เข้าสู่ระบบเพื่อใช้งาน</p>
    </div>
    <label class="block mb-2">Username</label><input id="loginUsername" class="w-full border rounded-xl px-4 py-3 mb-4" value="admin">
    <label class="block mb-2">Password</label><input id="loginPassword" type="password" class="w-full border rounded-xl px-4 py-3 mb-6" value="123456">
    <button id="loginBtn" onclick="doLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold"><i class="fa-solid fa-right-to-bracket mr-2"></i>เข้าสู่ระบบ</button>
    <p class="text-xs text-gray-500 mt-4 text-center">Design by Tanawarat khamsiang</p>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="sidebar" class="sidebar bg-white w-[248px] min-h-screen fixed left-0 top-0 border-r shadow-sm no-print">
    <div class="h-[112px] flex items-center gap-3 px-5 border-b">
      <button onclick="toggleSidebar()" class="text-gray-600 md:hidden"><i class="fa-solid fa-xmark text-xl"></i></button>
      <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center"><i class="fa-solid fa-store text-2xl"></i></div>
      <div><h2 class="font-bold text-lg leading-tight">ระบบร้านค้าสหกรณ์โรงเรียนบ้านโสน</h2><p class="text-xs text-gray-500">ระบบจัดการร้านค้า V 1.0</p></div>
    </div>
    <div class="m-2 p-4 bg-gradient-to-br from-blue-500 to-blue-700 text-white rounded-xl shadow-lg">
      <p class="text-sm">สถิติวันนี้</p><div class="grid grid-cols-2 mt-3"><div><p class="text-xs">ยอดขาย</p><p id="sideSales" class="font-bold text-xl">฿0</p></div><div class="text-right"><p class="text-xs">รายการ</p><p id="sideCount" class="font-bold text-xl">0</p></div></div>
    </div>
    <nav id="menu" class="px-2 py-3 space-y-1"></nav>
  </aside>
  <main class="content ml-[248px] min-h-screen">
    <header class="h-[72px] bg-white border-b flex items-center justify-between px-6 sticky top-0 z-40 no-print">
      <div class="flex items-center gap-3"><button onclick="toggleSidebar()" class="md:hidden text-xl"><i class="fa-solid fa-bars"></i></button><span id="breadcrumb" class="text-sm text-gray-700"><i class="fa-solid fa-house mr-2"></i>หน้าหลัก</span></div>
      <div class="flex items-center gap-4"><div class="text-right text-sm"><p id="topName">ผู้ดูแลระบบ</p><p id="topRole" class="text-gray-500">admin</p></div><button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg font-semibold"><i class="fa-solid fa-right-from-bracket mr-2"></i>ออกจากระบบ</button></div>
    </header>
    <section id="page" class="p-6"></section>
  </main>
</div>

<script>
let state={user:null,settings:{},products:[],members:[],users:[],dashboard:{},cart:[],page:'dashboard',dividendCalc:null,memberPortal:null,memberPortalMessage:''};
const menus=[
 {id:'dashboard',text:'ภาพรวมร้านค้า',icon:'fa-gauge-high',roles:['admin','teacher','cashier']},
 {id:'productOverview',text:'ภาพรวมสินค้า',icon:'fa-chart-pie',roles:['admin','teacher','cashier']},
 {id:'performance',text:'ผลประกอบการ',icon:'fa-arrow-trend-up',roles:['admin','teacher']},
 {id:'memberProfile',text:'ข้อมูลของฉัน',icon:'fa-id-card',roles:['member']},
 {id:'pos',text:'ขายสินค้า',icon:'fa-cart-shopping',roles:['admin','teacher','cashier']},
 {id:'coupons',text:'คูปอง',icon:'fa-ticket',roles:['admin','teacher','cashier']},
 {id:'products',text:'จัดการสินค้า',icon:'fa-boxes-stacked',roles:['admin','teacher']},
 {id:'categories',text:'จัดการหมวดหมู่',icon:'fa-tags',roles:['admin','teacher']},
 {id:'members',text:'จัดการสมาชิก',icon:'fa-users',roles:['admin','teacher']},
 {id:'dividends',text:'ปันผลเฉลี่ยคืนสมาชิก',icon:'fa-coins',roles:['admin','teacher']},
 {id:'saleOrders',text:'จัดการยอดสั่งซื้อ',icon:'fa-receipt',roles:['admin','teacher']},
 {id:'reports',text:'รายงานยอดขาย',icon:'fa-chart-line',roles:['admin','teacher']},
 {id:'users',text:'จัดการผู้ใช้งาน',icon:'fa-user-shield',roles:['admin']},
 {id:'settings',text:'ตั้งค่าระบบ',icon:'fa-gear',roles:['admin']}
];
/* ---- Loader overlay ---- */
function showLoader(msg){
  let el=document.getElementById('saveLoader');
  if(!el){
    el=document.createElement('div');
    el.id='saveLoader';
    el.className='fixed inset-0 bg-black/40 z-[200] flex items-center justify-center';
    el.innerHTML='<div class="bg-white rounded-2xl shadow-2xl px-10 py-8 flex flex-col items-center gap-3"><i class="fa-solid fa-spinner fa-spin text-blue-600 text-4xl"></i><p id="saveLoaderMsg" class="font-bold text-gray-700 text-lg">กำลังบันทึก...</p></div>';
    document.body.appendChild(el);
  }
  document.getElementById('saveLoaderMsg').textContent=msg||'กำลังบันทึก...';
  el.classList.remove('hidden');
}
function hideLoader(){
  const el=document.getElementById('saveLoader');
  if(el)el.classList.add('hidden');
}
/* ---- GAS call helpers ---- */
function call(fn,...args){
  return new Promise((res,rej)=>{
    google.script.run
      .withSuccessHandler(res)
      .withFailureHandler(err=>rej(err))
      [fn](...args);
  });
}
function callJson(fn,...args){
  return new Promise((res,rej)=>{
    google.script.run
      .withSuccessHandler(raw=>{
        try{
          if(typeof raw === 'string') return res(JSON.parse(raw));
          return res(raw);
        }catch(e){
          rej(new Error('ระบบตอบกลับไม่ใช่ JSON: '+raw));
        }
      })
      .withFailureHandler(err=>rej(err))
      [fn](...args);
  });
}
function money(n){return '฿'+Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2});}
function toNum_(v){const n=Number(v||0);return isNaN(n)?0:n;}
function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));}
function imageSrc_(url){
  const raw=String(url||'').trim();
  if(!raw)return '';
  const match=raw.match(/\/file\/d\/([^/]+)/) || raw.match(/[?&]id=([^&]+)/);
  if(match&&match[1])return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(match[1])+'&sz=w1000';
  return raw;
}
function msgError(title,e){
  console.error(title,e);
  const detail = (e && (e.message || e.toString())) ? (e.message || e.toString()) : 'ไม่ทราบสาเหตุ';
  Swal.fire(title, detail, 'error');
}
async function init(){
  // doGet() ตั้งค่าระบบไว้แล้ว จึงไม่เรียก ensureSetup ซ้ำ เพื่อลดเวลาหน้าแรก
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('loginPage').classList.remove('hidden');
}
async function doLogin(){
  const u=document.getElementById('loginUsername').value.trim();
  const p=document.getElementById('loginPassword').value;
  const btn=document.getElementById('loginBtn');
  if(!u || !p) return Swal.fire('กรุณากรอก Username และ Password','','warning');
  try{
    btn.disabled=true;
    btn.innerHTML='<i class="fa-solid fa-spinner fa-spin mr-2"></i>กำลังเข้าสู่ระบบ...';
    const r=await callJson('apiLogin',u,p);
    if(!r || !r.success){
      return Swal.fire('เข้าสู่ระบบไม่สำเร็จ', (r && r.message) ? r.message : 'ไม่พบการตอบกลับจากระบบ', 'error');
    }
    state.user=r.data;
    await loadData();
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    renderMenu();
    go(state.user.role==='member'?'memberProfile':'dashboard');
    Swal.fire({icon:'success',title:'เข้าสู่ระบบสำเร็จ',timer:900,showConfirmButton:false});
  }catch(e){
    msgError('เกิดข้อผิดพลาดระหว่างเข้าสู่ระบบ', e);
  }finally{
    btn.disabled=false;
    btn.innerHTML='<i class="fa-solid fa-right-to-bracket mr-2"></i>เข้าสู่ระบบ';
  }
}
async function loadData(){
  const r=await callJson('apiGetInitialDataFast', state.user?.role || 'cashier', state.user?.username || '', state.user?.name || '');
  if(!r || !r.success) throw new Error((r && r.message) ? r.message : 'โหลดข้อมูลเริ่มต้นไม่สำเร็จ');
  Object.assign(state,r.data);
  updateMiniStats();
}
function updateMiniStats(){
  document.getElementById('topName').textContent=state.user?.name || state.user?.username || '';
  document.getElementById('topRole').textContent=state.user?.role || '';
  document.getElementById('sideSales').textContent=money(state.dashboard?.todaySales || 0);
  document.getElementById('sideCount').textContent=state.dashboard?.todayCount || 0;
}
function renderMenu(){menu.innerHTML=menus.filter(m=>m.roles.includes(state.user.role)).map(m=>`<button onclick="go('${m.id}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left ${state.page===m.id?'menu-active':'text-gray-600 hover:bg-gray-100'}"><i class="fa-solid ${m.icon} w-5"></i><span>${m.text}</span></button>`).join('');}
function go(p){state.page=p;renderMenu();breadcrumb.innerHTML='<i class="fa-solid fa-house mr-2"></i> หน้าหลัก <i class="fa-solid fa-chevron-right mx-2 text-xs"></i> '+(menus.find(m=>m.id===p)?.text||'');({dashboard:pageDashboard,productOverview:pageProductOverview,performance:pagePerformance,memberProfile:pageMemberProfile,pos:pagePOS,coupons:pageCoupons,products:pageProducts,categories:pageCategories,members:pageMembers,dividends:pageDividends,saleOrders:pageSaleOrders,reports:pageReports,users:pageUsers,settings:pageSettings}[p]||pageDashboard)();}
function toggleSidebar(){sidebar.classList.toggle('open')}
function logout(){
  try{
    state={user:null,settings:{},products:[],members:[],users:[],dashboard:{},cart:[],page:'dashboard',dividendCalc:null,memberPortal:null,memberPortalMessage:''};
    document.getElementById('app').classList.add('hidden');
    document.getElementById('loginPage').classList.remove('hidden');
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('loginUsername').value='admin';
    document.getElementById('loginPassword').value='123456';
    document.getElementById('page').innerHTML='';
    document.getElementById('menu').innerHTML='';
  }catch(e){
    console.error('logout error', e);
    window.top.location.href = window.location.href;
  }
}

function pageTitle(icon,title,btn){return `<div class="card p-6"><div class="flex justify-between items-center border-b pb-4 mb-5"><h1 class="text-2xl font-bold"><i class="fa-solid ${icon} text-blue-600 mr-3"></i>${title}</h1>${btn||''}</div>`}
/* ========== HELPERS ========== */
function canManageProducts(){return state.user.role==='admin'||state.user.role==='teacher';}
function canManageMembers(){return state.user.role==='admin'||state.user.role==='teacher';}
function canManageUsers(){return state.user.role==='admin';}
function canUseCoupons(){return ['admin','teacher','cashier'].includes(state.user.role);}
function roleTH(r){return {admin:'ผู้ดูแลระบบ',teacher:'ครูผู้ดูแล',cashier:'พนักงานขาย',member:'สมาชิก'}[r]||r;}

/* ========== DASHBOARD ========== */
function pageDashboard(){
  const role=state.user.role;
  const allLinks=[
    ['pos','fa-cart-shopping','ขายสินค้า','ระบบขายแบบเร็ว','bg-blue-600',['admin','teacher','cashier']],
    ['products','fa-boxes-stacked','จัดการสินค้า','เพิ่ม/แก้ไข/ลบ','bg-yellow-500',['admin','teacher']],
    ['members','fa-users','จัดการสมาชิก','เพิ่ม/แก้ไข/ลบ','bg-pink-500',['admin','teacher']],
    ['dividends','fa-coins','ปันผล','คำนวณเฉลี่ยคืน','bg-teal-500',['admin','teacher']],
    ['reports','fa-chart-line','รายงาน','สถิติการขาย','bg-orange-500',['admin','teacher']],
    ['users','fa-user-shield','จัดการผู้ใช้','เพิ่ม/แก้ไข/ลบ','bg-indigo-600',['admin']],
    ['settings','fa-gear','ตั้งค่า','ตั้งค่าระบบ','bg-slate-700',['admin']]
  ].filter(a=>a[5].includes(role));
  const cols=Math.min(allLinks.length,4);
  page.innerHTML=pageTitle('fa-gauge-high','ภาพรวมร้านค้า')+`
<div class="grid grid-cols-2 md:grid-cols-${cols} gap-4 mb-6">${allLinks.map(a=>`<button onclick="go('${a[0]}')" class="${a[4]} text-white rounded-xl p-5 shadow text-center hover:opacity-90 transition"><i class="fa-solid ${a[1]} text-3xl mb-2"></i><h3 class="font-bold">${a[2]}</h3><p class="text-sm opacity-90">${a[3]}</p></button>`).join('')}</div>
<div class="grid grid-cols-1 md:grid-cols-4 gap-5 mb-6">
${statCard('ยอดขายวันนี้',money(state.dashboard.todaySales),state.dashboard.todayCount+' รายการ','fa-calendar','text-blue-600')}
${statCard('สมาชิกทั้งหมด',state.dashboard.totalMembers,'สมาชิกที่ลงทะเบียน','fa-users','text-green-600')}
${statCard('สินค้าทั้งหมด',state.dashboard.totalProducts,'รายการสินค้า','fa-box','text-purple-600')}
${statCard('สินค้าใกล้หมด',state.dashboard.lowStock,'รายการ','fa-triangle-exclamation','text-yellow-500')}
</div>
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card p-5"><h3 class="font-bold text-lg mb-4">การขายล่าสุด</h3>${(state.dashboard.recentSales||[]).map(s=>`<div class="flex justify-between border-b py-3"><div><b>${esc(s.receiptNo)}</b><p class="text-sm text-gray-500">${esc(s.saleDate)} • ${esc(s.customerName)}</p></div><b class="text-green-600">${money(s.totalAmount)}</b></div>`).join('')||'<p class="text-gray-400 text-center py-8">ยังไม่มีรายการขาย</p>'}</div>
  <div class="card p-5"><h3 class="font-bold text-lg mb-4">ยอดขาย 7 วันล่าสุด</h3><canvas id="salesChart" height="160"></canvas></div>
</div></div>`;setTimeout(drawChart,100);
}
function statCard(t,v,s,ic,c){return `<div class="card p-6"><div class="flex justify-between"><div><h3 class="font-bold">${t}</h3><p class="text-3xl font-bold mt-5">${v}</p><p class="text-sm text-gray-500 mt-2">${s}</p></div><i class="fa-solid ${ic} ${c} text-2xl"></i></div></div>`}
function drawChart(){const ctx=document.getElementById('salesChart');if(!ctx)return;new Chart(ctx,{type:'line',data:{labels:(state.dashboard.chart||[]).map(x=>x.date),datasets:[{label:'ยอดขาย',data:(state.dashboard.chart||[]).map(x=>x.amount),fill:true,tension:.35,borderColor:'#2563eb',backgroundColor:'rgba(37,99,235,.1)'}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}})}

/* ========== PRODUCT OVERVIEW ========== */
function pageProductOverview(){
  const allCats=productCategories_();
  const activeFilter=window.__productOverviewCat||'ทุกหมวดหมู่';
  const activeStockFilter=window.__productOverviewStock||'all';
  const products=state.products||[];
  const matchStockFilter=p=>{
    const stock=Number(p.stock||0);
    if(activeStockFilter==='low')return stock>0&&stock<5;
    if(activeStockFilter==='out')return stock<=0;
    return true;
  };
  const lowStockCount=products.filter(p=>Number(p.stock)>0&&Number(p.stock)<5).length;
  const outCount=products.filter(p=>Number(p.stock)<=0).length;
  const filteredByCategory=activeFilter==='ทุกหมวดหมู่'?products:products.filter(p=>p.category===activeFilter);
  const filteredProducts=filteredByCategory.filter(matchStockFilter);

  // Build category filter pills
  const catPills=['ทุกหมวดหมู่',...allCats].map(c=>{
    const isActive=c===activeFilter;
    const count=c==='ทุกหมวดหมู่'?products.length:products.filter(p=>p.category===c).length;
    const hasLow=c==='ทุกหมวดหมู่'
      ?products.some(p=>Number(p.stock)>0&&Number(p.stock)<5)
      :products.filter(p=>p.category===c).some(p=>Number(p.stock)>0&&Number(p.stock)<5);
    return `<button onclick="window.__productOverviewCat='${esc(c)}';pageProductOverview();"
      class="flex-shrink-0 flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium border transition
        ${isActive?'bg-blue-600 text-white border-blue-600 shadow':'bg-white text-gray-600 border-gray-200 hover:bg-blue-50 hover:border-blue-300'}">
      ${esc(c)}
      <span class="${isActive?'bg-white/30 text-white':'bg-gray-100 text-gray-500'} text-xs px-2 py-0.5 rounded-full font-bold">${count}</span>
      ${hasLow&&!isActive?'<span class="w-2 h-2 rounded-full bg-amber-400 flex-shrink-0"></span>':''}
    </button>`;
  }).join('');

  // Build product cards
  const cardHtml=filteredProducts.length?filteredProducts.map(p=>{
    const stock=Number(p.stock||0);
    const isOut=stock<=0;
    const isLow=stock>0&&stock<5;
    let stockColor='text-emerald-600';
    let cardBorder='border-gray-200';
    let badge='';
    if(isOut){stockColor='text-red-600';cardBorder='border-red-200';badge='<span class="inline-flex items-center gap-1 bg-red-100 text-red-600 text-xs font-bold px-2 py-1 rounded-full"><i class="fa-solid fa-circle-xmark"></i>หมดสต็อก</span>';}
    else if(isLow){stockColor='text-amber-600';cardBorder='border-amber-300';badge=`<span class="inline-flex items-center gap-1 bg-amber-100 text-amber-700 text-xs font-bold px-2 py-1 rounded-full"><i class="fa-solid fa-triangle-exclamation"></i>สินค้าใกล้หมด</span>`;}
    else{badge='<span class="inline-flex items-center gap-1 bg-emerald-100 text-emerald-700 text-xs px-2 py-1 rounded-full"><i class="fa-solid fa-circle-check"></i>พร้อมขาย</span>';}
    return `<div class="bg-white border-2 ${cardBorder} rounded-2xl p-4 flex flex-col gap-2 shadow-sm hover:shadow-md transition">
      <div class="flex items-start gap-3">
        <img src="${esc(imageSrc_(p.imageUrl))}" width="60" height="60" onload="fixProductOverviewImage_(this)" onerror="this.src='https://placehold.co/48x48/e0ecff/2563eb?text=สินค้า';fixProductOverviewImage_(this)" class="product-overview-img w-7 h-7 object-cover rounded-lg flex-shrink-0" style="width:28px!important;height:28px!important;min-width:28px!important;min-height:28px!important;max-width:28px!important;max-height:28px!important;object-fit:cover!important;display:block!important;flex:0 0 28px!important;">
        <div class="flex-1 min-w-0">
          <b class="block text-sm leading-snug truncate">${esc(p.productName)}</b>
          <span class="inline-block text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full mt-1">${esc(p.category)}</span>
        </div>
      </div>
      <div class="flex items-end justify-between mt-1">
        <div>
          ${badge}
        </div>
        <div class="text-right">

function fixProductOverviewImage_(img){
  if(!img)return;
  img.setAttribute('width','60');
  img.setAttribute('height','60');
  ['width','height','min-width','min-height','max-width','max-height'].forEach(p=>img.style.setProperty(p,'28px','important'));
  img.style.setProperty('object-fit','cover','important');
  img.style.setProperty('display','block','important');
  img.style.setProperty('flex','0 0 28px','important');
  img.style.setProperty('position','static','important');
  img.style.setProperty('inset','auto','important');
  img.style.setProperty('transform','none','important');
}
function enforceProductOverviewImages_(){
  setTimeout(()=>document.querySelectorAll('.product-overview-img').forEach(fixProductOverviewImage_),0);
}

async function refreshMemberPortal(){

function memberOptionLabel(m){
  const code=m.studentCode||m.memberId||'';
  const room=m.classroom?` | ${m.classroom}`:'';
  return `${m.fullName||''} | ${code}${room}`;
}
function memberBarcodeValue_(m={}){
  const saved=String(m.memberBarcode||m.memberBarcodeNo||m.barcode||'').trim();
  if(saved)return saved;
  const base=String(m.studentCode||m.memberId||'').trim().replace(/\s+/g,'');
  return base?`MEM${base}`:'';
}
function findMemberByBarcode_(barcode){
  const code=String(barcode||'').trim().toLowerCase();
  if(!code)return null;
  return (state.members||[]).filter(m=>m.status==='active').find(m=>{
    const student=String(m.studentCode||'').trim();
    const memberId=String(m.memberId||'').trim();
    return String(memberBarcodeValue_(m)).toLowerCase()===code ||
      String(m.memberBarcode||'').trim().toLowerCase()===code ||
      (student&&`mem${student}`.toLowerCase()===code) ||
      (memberId&&`mem${memberId}`.toLowerCase()===code) ||
      (student&&student.toLowerCase()===code) ||
      (memberId&&memberId.toLowerCase()===code);
  })||null;
}
function productOrderOptionLabel(p){
  const barcode=p.barcode?` | ${p.barcode}`:'';
  return `${p.productName||''}${barcode} | ${money(p.price)} | คงเหลือ ${p.stock} ${p.unit||'ชิ้น'}`;
}

    <span class="flex items-start gap-2"><i class="fa-solid ${icon} text-blue-500 mt-1 w-4"></i><span class="min-w-0"><b class="block text-sm truncate">${label}</b>${sub?`<span class="block text-xs text-gray-500 truncate">${sub}</span>`:''}</span></span>
  </button>`;
}
function encodeMenuValue(v){

function changeQty(k,delta){
  const it=state.cart[k];if(!it)return;
  const newQty=it.qty+delta;
  if(newQty<=0){state.cart.splice(k,1);}
  else if(newQty>it.maxStock){Swal.fire('สินค้าไม่พอ',`มีสต็อกเพียง ${it.maxStock}`,'warning');}
  else{it.qty=newQty;}
  renderCart();
}
async function saveSale(){
  if(!state.cart.length)return Swal.fire('ยังไม่มีสินค้าในตะกร้า','เพิ่มสินค้าก่อนบันทึก','warning');
  const saleMemberEl=document.getElementById('saleMember');
  const member=saleMemberEl?state.members.find(m=>m.memberId===saleMemberEl.value):null;
  const pmEl=document.getElementById('paymentMethod');
  const saleItems=state.cart.map(i=>({productId:i.productId,productName:i.productName,price:i.price,quantity:i.qty}));
  const totalAmount=state.cart.reduce((a,i)=>a+i.price*i.qty,0);
  showLoader('กำลังบันทึกการขาย...');
  try{
    const r=await callJson('apiRecordSale',{
      items:saleItems,
      memberId:member?.memberId||'',customerName:member?.fullName||'ลูกค้าทั่วไป',
      paymentMethod:pmEl?.value||'เงินสด',seller:state.user.name
    });
    hideLoader();
    if(!r||!r.success)return Swal.fire('บันทึกไม่สำเร็จ',r?.message||'เกิดข้อผิดพลาด','error');
    // อัปเดต state.products จาก server (stock ลดแล้ว)
    if(r.data?.products){
      state.products=r.data.products;
    }
    if(r.data?.dashboard){state.dashboard=r.data.dashboard;updateMiniStats();}
    state.cart=[];
    // แสดงใบเสร็จสรุป
    const itemLines=saleItems.map(i=>`<tr><td style="padding:2px 6px;text-align:left">${esc(i.productName)}</td><td style="padding:2px 6px;text-align:center">${i.quantity}</td><td style="padding:2px 6px;text-align:right">${money(i.price*i.quantity)}</td></tr>`).join('');
    await Swal.fire({
      icon:'success',
      title:'บันทึกการขายสำเร็จ',
      html:`<div style="text-align:left">
        <p class="text-gray-500 text-sm mb-2">ใบเสร็จ: <b>${r.data.receiptNo}</b> &nbsp;|&nbsp; ${r.data.saleDate}</p>
        <table style="width:100%;font-size:13px;border-collapse:collapse">
          <thead><tr style="background:#f3f4f6"><th style="padding:4px 6px;text-align:left">สินค้า</th><th style="padding:4px 6px">จำนวน</th><th style="padding:4px 6px;text-align:right">ราคา</th></tr></thead>
          <tbody>${itemLines}</tbody>
          <tfoot><tr style="border-top:2px solid #e5e7eb;font-weight:bold"><td colspan="2" style="padding:6px">ยอดรวม</td><td style="padding:6px;text-align:right;color:#16a34a;font-size:16px">${money(r.data.totalAmount)}</td></tr></tfoot>
        </table>
        <p class="text-xs text-gray-400 mt-2 text-center">${state.settings.receiptFooter||'ขอบคุณที่ใช้บริการ'}</p>
      </div>`,
      confirmButtonText:'ขายต่อ',
      showDenyButton:true,
      denyButtonText:'กลับหน้าหลัก',
      denyButtonColor:'#6b7280'
    }).then(result=>{
      if(result.isDenied){go('dashboard');}
      else{
        // ขายต่อ: รีเซ็ต POS พร้อมสต็อกอัปเดต
        renderPOS();
      }
    });
  }catch(e){hideLoader();msgError('เกิดข้อผิดพลาดในการบันทึกขาย',e);}
}

/* ========== PRODUCTS ========== */
const DEFAULT_PRODUCT_CATEGORIES=['อาหาร','เครื่องดื่ม','เครื่องเขียน','อื่นๆ'];
function productCategories_(){
  let saved=[];
  const raw=state.settings?.productCategories||'';
  let hasSaved=false;
  if(raw){
    try{
      const parsed=JSON.parse(raw);
      if(Array.isArray(parsed)){saved=parsed;hasSaved=true;}
    }catch(e){
      saved=String(raw).split(/[,\n|]/);
      hasSaved=true;
    }
  }
  const values=(hasSaved?saved:DEFAULT_PRODUCT_CATEGORIES).concat((state.products||[]).map(p=>p.category));
  const seen={};
  return values.map(v=>String(v||'').trim()).filter(v=>{
    if(!v||seen[v])return false;
    seen[v]=true;
    return true;
  });
}
function productCategoryOptions_(selected='', includeAll=false){
  const options=productCategories_().map(c=>`<option value="${esc(c)}" ${selected===c?'selected':''}>${esc(c)}</option>`).join('');
  return includeAll?`<option value="">ทุกหมวดหมู่</option>${options}`:options;
}
async function saveProductCategories_(categories){
  const cleaned=[];
  const seen={};
  categories.map(c=>String(c||'').trim()).forEach(c=>{
    const key=c.toLowerCase();
    if(c&&!seen[key]){
      seen[key]=true;
      cleaned.push(c);
    }
  });
  const saved=await callJson('apiSaveSettings',{...state.settings,productCategories:JSON.stringify(cleaned)});
  if(!saved||!saved.success)throw new Error(saved?.message||'บันทึกหมวดหมู่ไม่สำเร็จ');
  state.settings=saved.data;
  return cleaned;
}

function downloadBarcode_(barcodeVal){
  const svg=document.getElementById('bcSvg');
  if(!svg)return;
  const svgData=new XMLSerializer().serializeToString(svg);
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  const img=new Image();
  const svgBlob=new Blob([svgData],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(svgBlob);
  img.onload=()=>{
    canvas.width=img.width*2;canvas.height=img.height*2;
    ctx.scale(2,2);ctx.drawImage(img,0,0);
    URL.revokeObjectURL(url);
    const a=document.createElement('a');
    a.download='barcode-'+(barcodeVal||'product')+'.png';
    a.href=canvas.toDataURL('image/png');
    a.click();
  };
  img.src=url;
}

function handleProductImageFile_(input){
  const file=input?.files?.[0];
  const nameEl=document.getElementById('f_img_name');
  const preview=document.getElementById('f_img_preview');
  const hint=document.getElementById('f_img_hint');
  if(!file)return;
  if(!file.type.startsWith('image/')){
    input.value='';
    window.__productImageUpload=null;
    if(nameEl)nameEl.textContent='ยังไม่ได้เลือกรูปภาพ';
    if(hint)hint.textContent='กรุณาเลือกไฟล์รูปภาพเท่านั้น';
    return;
  }
  if(file.size>5*1024*1024){
    input.value='';
    window.__productImageUpload=null;
    if(nameEl)nameEl.textContent='ยังไม่ได้เลือกรูปภาพ';
    if(hint)hint.textContent='ไฟล์รูปภาพต้องไม่เกิน 5 MB';
    return;
  }
  const reader=new FileReader();
  reader.onload=e=>{
    window.__productImageUpload={base64:e.target.result,filename:file.name,mimeType:file.type};
    if(nameEl)nameEl.textContent=file.name;
    if(hint)hint.textContent='เลือกรูปภาพแล้ว ระบบจะอัปโหลดเมื่อกดบันทึก';
    if(preview){
      preview.src=e.target.result;
      preview.classList.remove('hidden');
    }
  };
  reader.onerror=()=>{
    window.__productImageUpload=null;
    if(hint)hint.textContent='อ่านไฟล์รูปภาพไม่สำเร็จ';
  };
  reader.readAsDataURL(file);
}

        showLoader('กำลังบันทึกสินค้า...');
      }

  });

async function removeProduct(id){
  if(!canManageProducts())return Swal.fire('ไม่มีสิทธิ์','','error');
  const p=state.products.find(x=>x.productId===id);
  const confirm=await Swal.fire({title:'ยืนยันลบสินค้า?',html:`ลบ <b>${esc(p?.productName||id)}</b> ออกจากระบบ?`,icon:'warning',showCancelButton:true,confirmButtonText:'ลบ',confirmButtonColor:'#ef4444',cancelButtonText:'ยกเลิก'});
  if(!confirm.isConfirmed)return;
  showLoader('กำลังลบสินค้า...');
  try{
    const r=await callJson('apiDeleteProduct',id,state.user.role);
    hideLoader();
    if(!r||!r.success)return Swal.fire('ลบไม่สำเร็จ',r?.message||'เกิดข้อผิดพลาด','error');
    if(r?.data)state.products=r.data;
    renderProductsList();
    Swal.fire({icon:'success',title:'ลบสินค้าสำเร็จ',timer:1200,showConfirmButton:false});
  }catch(e){hideLoader();msgError('เกิดข้อผิดพลาด',e);}
}

/* ---- Download CSV Template ---- */
function downloadMemberTemplate(){
  const header='fullName,studentCode,memberBarcode,classroom,shares,sharePrice,phone,joinedDate,note';
  const sample=[
    'ชื่อ นามสกุล,12345,MEM12345,ป.1/1,10,20,0812345678,2026-05-19,หมายเหตุ',
    'ด.ช.ตัวอย่าง ใจดี,12346,MEM12346,ป.2/1,5,20,,,'
  ].join('\n');
  const bom='\uFEFF'; // BOM for Excel Thai
  const csv=bom+header+'\n'+sample;
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='member_template.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

function handleImportDrop(event){
  event.preventDefault();
  document.getElementById('dropZone').classList.remove('border-blue-400','bg-blue-50');
  const file=event.dataTransfer.files[0];
  if(file)parseImportFile(file);
}
function handleImportFile(inp){
  const file=inp.files[0];
  if(file)parseImportFile(file);
}
function parseImportFile(file){
  const ext=file.name.split('.').pop().toLowerCase();
  if(ext==='csv'){
    const reader=new FileReader();
    reader.onload=e=>parseImportCSV(e.target.result);
    reader.readAsText(file,'UTF-8');
  } else if(ext==='xlsx'||ext==='xls'){
    const reader=new FileReader();
    reader.onload=e=>parseImportXLSX(e.target.result);
    reader.readAsArrayBuffer(file);
  } else {
    Swal.showValidationMessage('รองรับเฉพาะไฟล์ .csv, .xlsx, .xls เท่านั้น');
  }
}
function parseImportCSV(text){
  // strip BOM
  text=text.replace(/^\uFEFF/,'');
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2)return Swal.showValidationMessage('ไฟล์ต้องมีอย่างน้อย 2 แถว (header + ข้อมูล)');
  const headers=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
  const rows=lines.slice(1).map(line=>{
    const cols=line.split(',').map(c=>c.trim().replace(/^"|"$/g,''));
    const obj={};
    headers.forEach((h,i)=>obj[h]=cols[i]||'');
    return obj;
  }).filter(r=>Object.values(r).some(v=>v));
  showImportPreview(headers,rows);
}
function parseImportXLSX(arrayBuffer){
  // ใช้ SheetJS ถ้า load ได้
  if(typeof XLSX==='undefined'){
    // ถ้าไม่มี SheetJS แจ้งให้ใช้ CSV
    Swal.showValidationMessage('ไม่พบ library XLSX — กรุณาใช้ไฟล์ .csv แทน หรือบันทึก Excel เป็น CSV ก่อน');
    return;
  }
  const wb=XLSX.read(arrayBuffer,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const data=XLSX.utils.sheet_to_json(ws,{defval:''});
  if(!data.length)return Swal.showValidationMessage('ไม่พบข้อมูลในไฟล์');
  const headers=Object.keys(data[0]);
  showImportPreview(headers,data);
}
function showImportPreview(headers,rows){
  // map headers (รองรับทั้งภาษาไทยและ English)
  const MAP={
    'fullName':'fullName','ชื่อ-นามสกุล':'fullName','ชื่อนามสกุล':'fullName','ชื่อ':'fullName',
    'studentCode':'studentCode','รหัสนักเรียน':'studentCode','รหัส':'studentCode',
    'memberBarcode':'memberBarcode','บาร์โค้ดสมาชิก':'memberBarcode','barcodeสมาชิก':'memberBarcode',
    'classroom':'classroom','ห้อง':'classroom','ชั้น/ห้อง':'classroom','ชั้น':'classroom',
    'shares':'shares','หุ้น':'shares','จำนวนหุ้น':'shares',
    'sharePrice':'sharePrice','ราคาต่อหุ้น':'sharePrice','ราคาหุ้น':'sharePrice',
    'phone':'phone','โทร':'phone','เบอร์โทร':'phone','เบอร์':'phone',
    'joinedDate':'joinedDate','วันที่สมัคร':'joinedDate','วันสมัคร':'joinedDate',
    'note':'note','หมายเหตุ':'note'
  };
  const mapped=rows.map(r=>{
    const obj={};
    Object.keys(r).forEach(k=>{ const m=MAP[k.trim()]; if(m)obj[m]=r[k]; });
    if(!obj.fullName) obj.fullName=r[Object.keys(r)[0]]||''; // fallback col 1
    return obj;
  }).filter(r=>String(r.fullName||'').trim());

  window._importRows=mapped;
  const displayCols=['fullName','studentCode','memberBarcode','classroom','shares','sharePrice','phone'];
  const colTH={fullName:'ชื่อ-นามสกุล',studentCode:'รหัส',memberBarcode:'บาร์โค้ด',classroom:'ห้อง',shares:'หุ้น',sharePrice:'ราคา/หุ้น',phone:'โทร'};

  document.getElementById('importPreviewTitle').textContent=`พบข้อมูล ${mapped.length} คน — ตัวอย่าง 5 แถวแรก:`;
  document.getElementById('importHead').innerHTML=displayCols.map(c=>`<th class="p-2 text-left font-semibold">${colTH[c]||c}</th>`).join('');
  document.getElementById('importBody').innerHTML=mapped.slice(0,5).map((r,i)=>`<tr class="${i%2?'bg-gray-50':''}">
    ${displayCols.map(c=>`<td class="p-2 ${!r.fullName?'text-red-500':''}">${esc(String(r[c]||''))}</td>`).join('')}
  </tr>`).join('');
  if(mapped.length>5){
    document.getElementById('importBody').innerHTML+=`<tr><td colspan="${displayCols.length}" class="p-2 text-gray-400 text-center">... และอีก ${mapped.length-5} คน</td></tr>`;
  }
  document.getElementById('importPreview').classList.remove('hidden');

  // check skips
  const missing=mapped.filter(r=>!String(r.fullName||'').trim());
  if(missing.length){
    document.getElementById('importSkipWarn').classList.remove('hidden');
    document.getElementById('importSkipWarn').textContent=`⚠️ พบ ${missing.length} แถวที่ไม่มีชื่อ-นามสกุล จะถูกข้ามโดยอัตโนมัติ`;
  }
}

async function removeMember(id){
  if(!canManageMembers())return Swal.fire('ไม่มีสิทธิ์','','error');
  const m=state.members.find(x=>x.memberId===id);
  const confirm=await Swal.fire({title:'ยืนยันลบสมาชิก?',html:`ลบ <b>${esc(m?.fullName||id)}</b> ออกจากระบบ?`,icon:'warning',showCancelButton:true,confirmButtonText:'ลบ',confirmButtonColor:'#ef4444',cancelButtonText:'ยกเลิก'});
  if(!confirm.isConfirmed)return;
  showLoader('กำลังลบสมาชิก...');
  try{
    const r=await callJson('apiDeleteMember',id,state.user.role);
    hideLoader();
    if(!r||!r.success)return Swal.fire('ลบไม่สำเร็จ',r?.message||'เกิดข้อผิดพลาด','error');

    renderMembersList();

  }catch(e){hideLoader();msgError('เกิดข้อผิดพลาด',e);}
}

  const qty=parseFloat(qtyEl?.value||0);
  const price=parseFloat(priceEl?.value||0);
  if(qty<=0)return Swal.showValidationMessage?Swal.showValidationMessage('จำนวนต้องมากกว่า 0'):alert('จำนวนต้องมากกว่า 0');
  showLoader('กำลังบันทึก...');
  try{
    const r=await callJson('apiUpdateSaleItem',itemId,qty,price,state.user.role);
    hideLoader();
    if(!r||!r.success)return Swal.fire('บันทึกไม่สำเร็จ',r?.message||'เกิดข้อผิดพลาด','error');
    if(subEl)subEl.textContent=money(qty*price);
    // อัปเดต state
    if(state._soData&&state._soData.items){
      const iIdx=state._soData.items.findIndex(i=>String(i.itemId)===String(itemId));
      if(iIdx>=0){state._soData.items[iIdx].quantity=qty;state._soData.items[iIdx].price=price;state._soData.items[iIdx].subtotal=qty*price;}
    }
    Swal.fire({icon:'success',title:'บันทึกสำเร็จ',text:'ยอดรวมและ stock ถูกปรับแล้ว',timer:1500,showConfirmButton:false}).then(()=>loadSaleOrders());
  }catch(e){hideLoader();Swal.fire('เกิดข้อผิดพลาด',e.message,'error');}
}

async function loadPerformance(){
  const mode=window.__perfMode||'month';
  let startDate='',endDate='',periodLabel='';
  if(mode==='day'){
    const v=document.getElementById('perf_day')?.value||'';
    window.__perfDay=v;
    startDate=v;endDate=v;
    periodLabel=v;
  }else if(mode==='month'){
    const v=document.getElementById('perf_month')?.value||'';
    window.__perfMonth=v;
    if(v){const[y,m]=v.split('-');const last=new Date(+y,+m,0).getDate();startDate=`${y}-${m}-01`;endDate=`${y}-${m}-${String(last).padStart(2,'0')}`;periodLabel=v;}
  }else if(mode==='year'){
    const v=document.getElementById('perf_year')?.value||'';
    window.__perfYear=v;
    if(v){startDate=`${v}-01-01`;endDate=`${v}-12-31`;periodLabel=`ปี ${v}`;}
  }else{
    // range
    const from=document.getElementById('perf_range_from')?.value||'';
    const to=document.getElementById('perf_range_to')?.value||'';
    window.__perfRangeFrom=from;
    window.__perfRangeTo=to;
    if(!from||!to)return Swal.fire('กรุณาเลือกวันที่','กรุณากรอกวันเริ่มต้นและวันสิ้นสุด','warning');
    if(from>to)return Swal.fire('วันที่ไม่ถูกต้อง','วันเริ่มต้นต้องไม่มากกว่าวันสิ้นสุด','warning');
    startDate=from;endDate=to;
    periodLabel=`${from} — ${to}`;
  }
  const catFilter=document.getElementById('perf_cat')?.value||'';
  window.__perfCat=catFilter;
  const el=document.getElementById('perfBox');
  if(el)el.innerHTML='<div class="text-center py-16"><i class="fa fa-spinner fa-spin text-4xl text-blue-600"></i><p class="mt-3 text-gray-500">กำลังวิเคราะห์ข้อมูล...</p></div>';
  showLoader('กำลังโหลดข้อมูลผลประกอบการ...');
  try{
    const r=await callJson('apiGetSaleOrders',{startDate,endDate,memberId:'',keyword:''});
    hideLoader();
    if(!r||!r.success)return el?el.innerHTML=`<p class="text-red-600 p-4">${r?.message||'โหลดไม่สำเร็จ'}</p>`:null;
    const orders=r.data.rows||[];
    const items=r.data.items||[];
    // aggregate per product
    const productMap={};
    items.forEach(item=>{
      const saleInRange=orders.some(s=>String(s.saleId)===String(item.saleId));
      if(!saleInRange)return;
      const prod=state.products.find(p=>String(p.productId)===String(item.productId));
      const cost=toNum_(prod?.cost||0);
      const cat=prod?.category||item.productName||'';
      if(catFilter&&cat!==catFilter)return;
      const key=String(item.productId||item.productName);
      if(!productMap[key]){
        productMap[key]={
          productId:item.productId,
          productName:item.productName,
          category:cat,
          unit:prod?.unit||'ชิ้น',
          imageUrl:prod?.imageUrl||'',
          totalQty:0,totalRevenue:0,totalCost:0,totalProfit:0
        };
      }
      const qty=toNum_(item.quantity);
      const price=toNum_(item.price);
      const revenue=price*qty;
      const costTotal=cost*qty;
      productMap[key].totalQty+=qty;
      productMap[key].totalRevenue+=revenue;
      productMap[key].totalCost+=costTotal;
      productMap[key].totalProfit+=revenue-costTotal;
    });
    const rows=Object.values(productMap).sort((a,b)=>b.totalProfit-a.totalProfit);
    const sumRevenue=rows.reduce((a,r)=>a+r.totalRevenue,0);
    const sumCost=rows.reduce((a,r)=>a+r.totalCost,0);
    const sumProfit=rows.reduce((a,r)=>a+r.totalProfit,0);
    const margin=sumRevenue>0?((sumProfit/sumRevenue)*100).toFixed(1):0;
    const totalQty=rows.reduce((a,r)=>a+r.totalQty,0);

    if(!rows.length){
      el.innerHTML='<div class="text-center text-gray-400 py-20"><i class="fa fa-box-open text-5xl mb-3 block opacity-30"></i><p>ไม่มีข้อมูลการขายในช่วงเวลานี้</p></div>';
      return;
    }

    // build chart bars
    const maxProfit=Math.max(...rows.map(r=>Math.abs(r.totalProfit)),1);
    const top10=rows.slice(0,10);
    const chartBars=top10.map(r=>{
      const pct=Math.round((Math.abs(r.totalProfit)/maxProfit)*100);
      const isLoss=r.totalProfit<0;
      const barColor=isLoss?'bg-red-400':'bg-emerald-500';
      return `<div class="flex items-center gap-3 mb-2">
        <div class="w-28 text-xs text-gray-600 text-right truncate flex-shrink-0" title="${esc(r.productName)}">${esc(r.productName)}</div>
        <div class="flex-1 bg-gray-100 rounded-full h-5 overflow-hidden">
          <div class="${barColor} h-5 rounded-full transition-all duration-500 flex items-center justify-end pr-2" style="width:${pct}%">
            <span class="text-white text-xs font-bold whitespace-nowrap">${pct>=20?money(r.totalProfit):''}</span>
          </div>
        </div>
        <div class="w-24 text-xs text-right font-bold ${isLoss?'text-red-600':'text-emerald-600'} flex-shrink-0">${money(r.totalProfit)}</div>
      </div>`;
    }).join('');

    // product table rows
    const tableRows=rows.map((r,i)=>{
      const pMargin=r.totalRevenue>0?((r.totalProfit/r.totalRevenue)*100).toFixed(1):0;
      const isLoss=r.totalProfit<0;
      const rank=i===0?'<span class="text-amber-500 font-black">🥇</span>':i===1?'<span class="text-gray-400 font-black">🥈</span>':i===2?'<span class="text-orange-400 font-black">🥉</span>':String(i+1);
      return `<tr class="border-t hover:bg-gray-50 text-sm">
        <td class="p-3 text-center">${rank}</td>
        <td class="p-3">
          <div class="flex items-center gap-3">
            <img src="${esc(imageSrc_(r.imageUrl))}" onerror="this.src='https://placehold.co/40x40/e0ecff/2563eb?text=สินค้า'" class="w-9 h-9 object-cover rounded-lg flex-shrink-0">
            <div>
              <b class="block text-sm leading-tight">${esc(r.productName)}</b>
              <span class="text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">${esc(r.category)}</span>
            </div>
          </div>
        </td>
        <td class="p-3 text-center">${r.totalQty.toLocaleString('th-TH')} ${esc(r.unit)}</td>
        <td class="p-3 text-right font-bold text-blue-700">${money(r.totalRevenue)}</td>
        <td class="p-3 text-right text-red-600">${money(r.totalCost)}</td>
        <td class="p-3 text-right font-black text-lg ${isLoss?'text-red-600':'text-emerald-600'}">${money(r.totalProfit)}</td>
        <td class="p-3 text-center">
          <span class="inline-block px-2 py-1 rounded-full text-xs font-bold ${isLoss?'bg-red-100 text-red-600':Number(pMargin)>=20?'bg-emerald-100 text-emerald-700':'bg-yellow-100 text-yellow-700'}">${pMargin}%</span>
        </td>
      </tr>`;
    }).join('');

    // ---- build daily transaction section ----
    // group orders by date
    const dayMap={};
    orders.forEach(o=>{
      const dateKey=String(o.saleDate||'').slice(0,10)||'ไม่ระบุวัน';
      if(!dayMap[dateKey])dayMap[dateKey]={date:dateKey,orders:[],total:0,count:0};
      dayMap[dateKey].orders.push(o);
      dayMap[dateKey].total+=toNum_(o.totalAmount);
      dayMap[dateKey].count++;
    });
    const dayKeys=Object.keys(dayMap).sort((a,b)=>b.localeCompare(a));

    const txDays=dayKeys.map((dk,di)=>{
      const day=dayMap[dk];
      const dayOrders=day.orders.sort((a,b)=>String(b.saleDate).localeCompare(String(a.saleDate)));
      const orderRows=dayOrders.map((o,oi)=>{
        const oItems=items.filter(i=>String(i.saleId)===String(o.saleId));
        const itemBadges=oItems.map(i=>{
          const prod=state.products.find(p=>String(p.productId)===String(i.productId));
          const cost=toNum_(prod?.cost||0);
          const profitItem=(toNum_(i.price)-cost)*toNum_(i.quantity);
          const profitColor=profitItem>=0?'text-emerald-600':'text-red-500';
          return `<div class="flex items-center justify-between py-1 border-b border-gray-100 last:border-0">
            <div class="flex items-center gap-2">
              <img src="${esc(imageSrc_(prod?.imageUrl||''))}" onerror="this.src='https://placehold.co/32x32/e0ecff/2563eb?text=สินค้า'" class="w-7 h-7 rounded-md object-cover flex-shrink-0">
              <span class="text-xs text-gray-700">${esc(i.productName)} <span class="text-gray-400">×${toNum_(i.quantity)}</span></span>
            </div>
            <div class="text-right flex-shrink-0 ml-3">
              <span class="text-xs font-semibold text-blue-700">${money(toNum_(i.price)*toNum_(i.quantity))}</span>
              <span class="text-xs ${profitColor} ml-2">(กำไร ${money(profitItem)})</span>
            </div>
          </div>`;
        }).join('');
        const memberBadge=o.memberId?`<span class="inline-flex items-center gap-1 bg-blue-100 text-blue-700 text-xs px-2 py-0.5 rounded-full ml-1"><i class="fa-solid fa-id-card text-[10px]"></i>สมาชิก</span>`:'<span class="inline-flex items-center gap-1 bg-gray-100 text-gray-500 text-xs px-2 py-0.5 rounded-full ml-1">ทั่วไป</span>';
        const uid=`tx_${di}_${oi}`;
        return `<div class="border border-gray-200 rounded-xl mb-2 overflow-hidden">
          <button onclick="(function(){var b=document.getElementById('${uid}');b.classList.toggle('hidden');var ic=document.getElementById('ic_${uid}');ic.classList.toggle('fa-chevron-down');ic.classList.toggle('fa-chevron-up');})()" class="w-full flex items-center justify-between px-4 py-3 bg-gray-50 hover:bg-blue-50 transition text-left gap-2">
            <div class="flex items-center gap-2 flex-1 min-w-0">
              <i class="fa-solid fa-receipt text-blue-500 flex-shrink-0"></i>

function openUser(u={}){
  if(!canManageUsers())return Swal.fire('ไม่มีสิทธิ์','เฉพาะ Admin เท่านั้น','error');
  Swal.fire({
    title:u.userId?'แก้ไขผู้ใช้งาน':'เพิ่มผู้ใช้งานใหม่',
    width:480,
    html:`
      <div class="text-left space-y-2">
        <div><label class="text-sm font-medium">ชื่อแสดง *</label><input id="u_name" class="swal2-input mt-1 !mx-0 !w-full" placeholder="ชื่อผู้ใช้งาน" value="${esc(u.name||'')}"></div>
        <div><label class="text-sm font-medium">Username *</label><input id="u_user" class="swal2-input mt-1 !mx-0 !w-full" placeholder="ตัวอักษร/ตัวเลข" value="${esc(u.username||'')}" ${u.username==='admin'?'readonly':''} ></div>
        <div><label class="text-sm font-medium">Password ${u.userId?'(ว่างไว้ = ไม่เปลี่ยน)':'*'}</label><input id="u_pass" type="password" class="swal2-input mt-1 !mx-0 !w-full" placeholder="${u.userId?'ว่างไว้ถ้าไม่ต้องการเปลี่ยน':'รหัสผ่านใหม่'}"></div>
        <div><label class="text-sm font-medium">สิทธิ์การใช้งาน</label><select id="u_role" class="swal2-input mt-1 !mx-0 !w-full" ${u.username==='admin'?'disabled':''}><option value="admin">admin – ผู้ดูแลระบบ (เข้าถึงทุกส่วน)</option><option value="teacher">teacher – ครู (จัดการสินค้า สมาชิก ปันผล รายงาน)</option><option value="cashier">cashier – แคชเชียร์ (ขายสินค้าอย่างเดียว)</option><option value="member">member – สมาชิก (ดูข้อมูลของตนเอง)</option></select></div>
        <div><label class="text-sm font-medium">สถานะ</label><select id="u_status" class="swal2-input mt-1 !mx-0 !w-full"><option value="active">เปิดใช้งาน</option><option value="inactive">ปิดใช้งาน</option></select></div>
      </div>`,
    didOpen:()=>{
      const role=document.getElementById('u_role');if(role)role.value=u.role||'cashier';
      const status=document.getElementById('u_status');if(status)status.value=u.status||'active';
    },
    showCancelButton:true,confirmButtonText:'บันทึก',cancelButtonText:'ยกเลิก',
    preConfirm:()=>{
      const name=document.getElementById('u_name').value.trim();
      const uname=document.getElementById('u_user').value.trim();
      const pass=document.getElementById('u_pass').value;
      if(!name)return Swal.showValidationMessage('กรุณาใส่ชื่อแสดง');
      if(!uname)return Swal.showValidationMessage('กรุณาใส่ Username');
      if(!u.userId&&!pass)return Swal.showValidationMessage('กรุณาใส่ Password');
      return {userId:u.userId,name:name,username:uname,password:pass,
        role:document.getElementById('u_role').value,status:document.getElementById('u_status').value};
    }
  }).then(async r=>{
    if(!r.isConfirmed)return;
    showLoader('กำลังบันทึกข้อมูลผู้ใช้...');
    try{
      const x=await callJson('apiSaveUser',r.value,state.user.role);
      hideLoader();
      if(!x||!x.success)return Swal.fire('บันทึกไม่สำเร็จ',x?.message||'เกิดข้อผิดพลาด','error');
      state.users=x.data;renderUsers();
      Swal.fire({icon:'success',title:'บันทึกผู้ใช้งานสำเร็จ',timer:1500,showConfirmButton:false});
    }catch(e){hideLoader();msgError('เกิดข้อผิดพลาด',e);}
  });
}
async function createMemberLogins(){
  if(!canManageUsers())return Swal.fire('ไม่มีสิทธิ์','เฉพาะ Admin เท่านั้น','error');
  const confirm=await Swal.fire({
    title:'สร้างบัญชีสมาชิกอัตโนมัติ?',
    html:'ระบบจะสร้าง/ปรับบัญชี role <b>member</b> จากข้อมูลสมาชิกทั้งหมด โดยใช้รหัสนักเรียนหรือรหัสสมาชิกเป็นทั้ง Username และ Password<br><br><span class="text-blue-700">บัญชี admin, teacher, cashier เดิมจะไม่ถูกเปลี่ยนแปลง</span>',
    icon:'question',
    showCancelButton:true,
    confirmButtonText:'สร้างบัญชี',
    cancelButtonText:'ยกเลิก',
    confirmButtonColor:'#2563eb'
  });
  if(!confirm.isConfirmed)return;
  showLoader('กำลังสร้างบัญชีสมาชิกอัตโนมัติ...');
  try{
    const r=await callJson('apiCreateMemberLoginUsers',state.user.role);
    hideLoader();
    if(!r||!r.success)return Swal.fire('สร้างบัญชีไม่สำเร็จ',r?.message||'เกิดข้อผิดพลาด','error');
    state.users=r.data.users||state.users;
    renderUsers();
    const skipped=(r.data.skipped||[]).length;
    const skippedText=skipped?`<br><span class="text-yellow-700">ข้าม ${skipped} รายการ เพราะไม่มีรหัสหรือรหัสซ้ำกับบัญชีเจ้าหน้าที่</span>`:'';
    Swal.fire({icon:'success',title:'สร้างบัญชีสมาชิกเรียบร้อย',html:`สร้างใหม่ <b>${r.data.created}</b> บัญชี<br>ปรับปรุงบัญชีสมาชิกเดิม <b>${r.data.updated}</b> บัญชี${skippedText}`,confirmButtonText:'ตกลง'});
  }catch(e){hideLoader();msgError('สร้างบัญชีสมาชิกไม่สำเร็จ',e);}
}
async function removeUser(id){
  if(!canManageUsers())return Swal.fire('ไม่มีสิทธิ์','','error');
  const u=state.users.find(x=>x.userId===id);
  const confirm=await Swal.fire({title:'ยืนยันลบผู้ใช้งาน?',html:`ลบ <b>${esc(u?.name||id)}</b> ออกจากระบบ?`,icon:'warning',showCancelButton:true,confirmButtonText:'ลบ',confirmButtonColor:'#ef4444',cancelButtonText:'ยกเลิก'});
  if(!confirm.isConfirmed)return;
  showLoader('กำลังลบผู้ใช้งาน...');
  try{
    const r=await callJson('apiDeleteUser',id,state.user.role);
    hideLoader();
    if(!r||!r.success)return Swal.fire('ลบไม่สำเร็จ',r?.message||'เกิดข้อผิดพลาด','error');
    state.users=r.data;renderUsers();
    Swal.fire({icon:'success',title:'ลบผู้ใช้งานสำเร็จ',timer:1200,showConfirmButton:false});
  }catch(e){hideLoader();msgError('เกิดข้อผิดพลาด',e);}
}

  page.innerHTML=pageTitle('fa-gear','ตั้งค่าระบบ')+`
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card p-5">
    <h3 class="font-bold mb-4"><i class="fa-solid fa-store mr-2"></i>ข้อมูลร้านค้า</h3>
    ${fInput('shopName','ชื่อร้านค้า',s.shopName)}
    ${fInput('sharePrice','ราคาหุ้น (บาท/หุ้น)',s.sharePrice,'number')}
    ${fInput('barcodePrefix','คำนำหน้าบาร์โค้ดอัตโนมัติ',s.barcodePrefix)}
    <label class="text-sm font-medium">ข้อความท้ายใบเสร็จ</label>
    <textarea id="receiptFooter" class="w-full border rounded-xl px-4 py-3 mt-1 mb-4 resize-none" rows="3">${esc(s.receiptFooter||'')}</textarea>
    ${fInput('driveFolderId','Google Drive Folder ID (สำหรับอัปโหลดรูป)',s.driveFolderId)}
  </div>
  <div class="card p-5">
    <h3 class="font-bold mb-4"><i class="fa-solid fa-qrcode mr-2"></i>การชำระเงินพร้อมเพย์</h3>
    ${fInput('promptPayNumber','หมายเลขพร้อมเพย์',s.promptPayNumber)}
    ${fInput('promptPayName','ชื่อบัญชีพร้อมเพย์',s.promptPayName)}
    ${fInput('promptPayQr','URL รูป QR Code',s.promptPayQr)}
    ${s.promptPayQr?`<div class="border rounded-xl p-4 text-center mt-2"><img src="${esc(s.promptPayQr)}" class="max-h-40 mx-auto rounded-xl" onerror="this.style.display='none'"><p class="text-xs text-gray-500 mt-2">ตัวอย่าง QR Code</p></div>`:'<div class="border-2 border-dashed rounded-xl p-6 text-center text-gray-400 mt-2"><i class="fa fa-qrcode text-4xl mb-2 block"></i><p>วาง URL รูป QR Code ข้างบน</p></div>'}
  </div>
</div>
<button onclick="saveSettingForm()" class="mt-6 bg-emerald-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-emerald-700 transition"><i class="fa-solid fa-floppy-disk mr-2"></i>บันทึกการตั้งค่า</button></div>`;
}
function fInput(id,label,val,type='text'){return `<label class="text-sm font-medium">${label}</label><input id="${id}" type="${type}" class="w-full border rounded-xl px-4 py-3 mt-1 mb-4" value="${esc(val||'')}">`;}// backward compat alias
function input(id,label,val,type='text'){return fInput(id,label,val,type);}
async function saveSettingForm(){
  const ids=['shopName','sharePrice','barcodePrefix','receiptFooter','driveFolderId','promptPayNumber','promptPayName','promptPayQr'];
  const data={...state.settings};
  ids.forEach(id=>{const el=document.getElementById(id);if(el)data[id]=el.value;});
  showLoader('กำลังบันทึกการตั้งค่า...');
  try{
    const r=await callJson('apiSaveSettings',data);
    hideLoader();
    if(!r||!r.success)return Swal.fire('บันทึกไม่สำเร็จ',r?.message||'เกิดข้อผิดพลาด','error');
    state.settings=r.data;
    Swal.fire({icon:'success',title:'บันทึกการตั้งค่าสำเร็จ',timer:1500,showConfirmButton:false});
    pageSettings();
  }catch(e){hideLoader();msgError('บันทึกไม่สำเร็จ',e);}
}

init();
</script>
</body>
</html>
